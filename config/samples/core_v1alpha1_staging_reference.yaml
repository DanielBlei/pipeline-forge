apiVersion: core.pipeline-forge.io/v1alpha1
kind: Staging
metadata:
  labels:
    app.kubernetes.io/name: pipeline-forge
    app.kubernetes.io/managed-by: kustomize
  name: reference-sample
  namespace: staging-sample
spec:
  description: Sample staging pipeline for data transformation
  ingest:
    mode: reference
    owner: data-team
    cronjob_ref:
      kind: CronJob
      namespace: default
      name: data-ingestion-job

  transform:
    project: analytics
    target: dev
    owner: data-engineering
    models:
      - stg_sample_model
    full_refresh: false
 
