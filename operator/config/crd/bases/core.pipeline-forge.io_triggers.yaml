---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.18.0
  name: triggers.core.pipeline-forge.io
spec:
  group: core.pipeline-forge.io
  names:
    kind: Trigger
    listKind: TriggerList
    plural: triggers
    shortNames:
    - trg
    singular: trigger
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Trigger type
      jsonPath: .spec.type
      name: Type
      priority: 1
      type: string
    - description: Owner
      jsonPath: .spec.owner
      name: Owner
      priority: 1
      type: string
    - description: Last triggered time
      jsonPath: .status.lastTriggeredTime
      name: Last Triggered
      type: date
    - description: Status message
      jsonPath: .status.status
      name: Status
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Trigger is the Schema for the triggers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Trigger
            properties:
              args:
                description: |-
                  Args are the arguments passed to the trigger container.
                  Useful for dynamic or parameterized behavior.
                items:
                  type: string
                type: array
              bigquery:
                description: |-
                  BigQuery contains configuration for a BigQuery-based trigger.
                  Only set if Type is "bigquery".
                properties:
                  dataset_id:
                    description: BigQuery Dataset ID
                    type: string
                  project_id:
                    description: Google Cloud Project
                    type: string
                  table_id:
                    description: BigQueryTable ID (e.g. "leads")
                    type: string
                required:
                - dataset_id
                - project_id
                - table_id
                type: object
              cooldownIntervalSeconds:
                description: |-
                  CooldownIntervalSeconds defines the minimum time that must pass between successive runs, in seconds.
                  Prevents rapid re-triggering.
                  Example: 300 (for 5 minutes), 3600 (for 1 hour)
                format: int32
                minimum: 0
                type: integer
              description:
                description: Description is an optional human-readable description
                  of the trigger.
                type: string
              gcs:
                description: |-
                  GCS contains configuration for a GCS-based trigger.
                  Only set if Type is "gcs".
                properties:
                  bucket:
                    description: GCS bucket name (without gs:// prefix)
                    type: string
                  prefix:
                    description: Optional prefix to match files (e.g. "exports/")
                    type: string
                required:
                - bucket
                type: object
              image:
                description: |-
                  Image is the container image used to run the trigger check.
                  This image is launched in a Kubernetes Job created by the Trigger controller.
                type: string
              maxRetry:
                description: |-
                  MaxRetry defines the maximum number of times to retry the transform step on failure.
                  If not set, defaults to 0 (no retries).
                format: int32
                type: integer
              name:
                description: Name of the trigger resource.
                type: string
              owner:
                description: Owner is an optional field indicating the team or user
                  responsible for this trigger.
                type: string
              pubsub:
                description: |-
                  PubSub contains configuration for a Pub/Sub-based trigger.
                  Only set if Type is "pubsub".
                properties:
                  messageFilter:
                    description: Optional message filter
                    properties:
                      attribute:
                        description: Attribute name to match (e.g. "dataset")
                        type: string
                      equals:
                        description: Required match value
                        type: string
                    required:
                    - attribute
                    - equals
                    type: object
                  topic:
                    description: Pub/Sub topic to subscribe to
                    type: string
                required:
                - topic
                type: object
              resources:
                description: Resources defines CPU and memory requests/limits for
                  the trigger Job container.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This is an alpha field and requires enabling the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              runOnce:
                description: |-
                  RunOnce, if true, means this trigger should only run once.
                  Controller skips execution if status.lastTriggeredTime is set.
                type: boolean
              schedule:
                description: |-
                  Schedule is a cron-style schedule for when the trigger should check for new data or events.

                  For example: "*/5 * * * *" (every 5 minutes)
                  Use standard cron syntax.
                type: string
              suspend:
                description: |-
                  Suspend indicates whether the trigger is currently suspended.
                  If true, the controller will not process the trigger.
                type: boolean
              type:
                description: |-
                  Type specifies the kind of event that will activate this trigger.
                  Supported values: "gcs", "pubsub", "bigquery".
                  This field determines which trigger details must be provided.
                enum:
                - gcs
                - pubsub
                - bigquery
                type: string
            required:
            - image
            - name
            - type
            type: object
          status:
            description: status defines the observed state of Trigger
            properties:
              attempts:
                description: Attempts tracks the number of times this step has been
                  attempted.
                format: int32
                type: integer
              conditions:
                description: |-
                  Conditions represent the latest available observations of the trigger's state.
                  Examples: Ready, Failed, CooldownActive
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              cooldownUntil:
                description: CooldownUntil is the next eligible time this trigger
                  can fire, based on Cooldown setting.
                format: date-time
                type: string
              failedAttempts:
                description: FailedAttempts tracks the number of failed attempts.
                format: int32
                type: integer
              lastAttemptTime:
                description: LastAttemptTime is the timestamp of the last attempt.
                format: date-time
                type: string
              lastCheckTime:
                description: LastCheckTime is the last time the controller evaluated
                  whether to trigger.
                format: date-time
                type: string
              lastFailureTime:
                description: LastFailureTime is the timestamp of the last failure.
                format: date-time
                type: string
              lastRunJobName:
                description: LastRunJobName is the name of the last Kubernetes Job
                  created by this trigger.
                type: string
              lastTriggeredTime:
                description: LastTriggeredTime is the last time this trigger successfully
                  resulted in a pipeline activation.
                format: date-time
                type: string
              maxRetries:
                description: MaxRetries defines the maximum number of retries allowed.
                format: int32
                type: integer
              message:
                description: Message provides human-readable information about the
                  trigger status or last evaluation.
                type: string
              observedGeneration:
                description: ObservedGeneration is the most recent generation observed
                  by the controller.
                format: int64
                type: integer
              retryCount:
                description: RetryCount tracks the number of retries for the current
                  attempt.
                format: int32
                type: integer
              status:
                description: Status is the status of the Trigger (e.g., Deployed,
                  Failed, Pending, Running).
                type: string
              successfulAttempts:
                description: SuccessfulAttempts tracks the number of successful attempts.
                format: int32
                type: integer
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
