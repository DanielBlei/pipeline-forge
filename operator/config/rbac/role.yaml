---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
- apiGroups:
  - batch
  resources:
  - jobs
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.pipeline-forge.io
  resources:
  - stagings
  - triggers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - core.pipeline-forge.io
  resources:
  - stagings/finalizers
  - triggers/finalizers
  verbs:
  - update
- apiGroups:
  - core.pipeline-forge.io
  resources:
  - stagings/status
  - triggers/status
  verbs:
  - get
  - patch
  - update
