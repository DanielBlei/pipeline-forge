# This rule is not used by the project pipeline-forge itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to core.pipeline-forge.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: pipeline-forge
    app.kubernetes.io/managed-by: kustomize
  name: staging-viewer-role
rules:
- apiGroups:
  - core.pipeline-forge.io
  resources:
  - stagings
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - core.pipeline-forge.io
  resources:
  - stagings/status
  verbs:
  - get
