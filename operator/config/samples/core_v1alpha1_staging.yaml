apiVersion: core.pipeline-forge.io/v1alpha1
kind: Staging
metadata:
  name: staging-sample
  namespace: staging-sample
  labels:
    app.kubernetes.io/name: pipeline-forge
    app.kubernetes.io/managed-by: kustomize
spec:
  description: |
    Bootstrap a CronJob for ingestion and runs dbt models
    for transformation. The controller watches Cronjobs Jobs for completion
    before triggering the transform step.
  owner: analytics-platform

  ingest:
    # The controller validates by name the resource exists on each reconcile.
    name: ingest-sample
    # Namespace of the referenced resource. Defaults to the Staging namespace if omitted.
    namespace: staging-sample
    # Reference mode: the CronJob must already exist in the cluster.
    # Bootstrap mode: Creates the Cronjob and owns its lifecycle
    mode: bootstrap
    type: cronjob
    image: busybox:latest
    schedule: "*/5 * * * *"
    command:
      - /bin/sh
      - -c
      - echo "[$(date)] Starting ingestion..." && sleep 5 && echo "[$(date)] Ingestion complete."
    # Optional team or service responsible for this ingest source
    owner: ingestion-team
    # Optional: poll interval to check the status of the ingestion resource (default is 120 seconds)
    pollIntervalSeconds: 60
    # Optional: tune CPU and memory for the ingest job/cronjob
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    # Optional: you could also set suspend: true here to pause ingestion logic
    suspend: false

  transform:
    name: transform-sample
    # BigQuery project or dbt project name
    project: analytics
    # Environment target (e.g., dev, staging, prod)
    target: dev
    # Container image for the transform Job (typically a dbt runner)
    image: ghcr.io/org/dbt-core:1.7.9
    # Optional args passed to the transform Job (override `models` and container entrypoint)
    args:
      - "run"
      - "--select"
      - "stg_user_events"
    # List of models to stage
    models:
      - stg_user_events
    # Optional: tune CPU and memory for the transform job
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    # Optional: The engine used for transformation
    engine: dbt
    # Optional:  Owner of this transform logic (team, project, etc.)
    owner: analytics-team
    # Optional: you could also set suspend: true here to pause transform logic
    suspend: false