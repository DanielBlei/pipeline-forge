apiVersion: core.pipeline-forge.io/v1alpha1
kind: Staging
metadata:
  name: user-events-staging
  namespace: staging-sample
  labels:
    app.kubernetes.io/name: pipeline-forge
    app.kubernetes.io/managed-by: kustomize
spec:
  # Optional human-readable description of this staging pipeline
  description: |
    Loads user events from raw ingest into the analytics layer using dbt models.
    Watches a CronJob for ingest completion before triggering transform.
  # Optional owner metadata for visibility
  owner: analytics-platform
  ingest:
      # The 'name' field is required and critical: it must exactly match the name of the existing CronJob, Job, or Trigger resource
      # that this Staging pipeline will reference or monitor. If the resource does not exist, the controller cannot proceed.
      # For example, if referencing a CronJob named 'ingest-user-events' in the 'raw-jobs' namespace, set name: ingest-user-events.
      # This field is used to locate/create and watch the upstream ingest resource.
    name: ingest-user-events
    # Namespace where the object belongs
    namespace: raw-jobs
    # Mode can be 'reference' to look for and watch an existing resource,
    # or 'bootstrap' to create and manage the resource automatically. (future implementation)
    mode: reference
   # Type = cronjob: the controller expects to monitor jobs from a Cronjob
    type: cronjob
     # Optional team or service responsible for this ingest source
    owner: ingestion-team
    # Optional: poll interval to check the status of the ingestion resource (default is 120 seconds)
    pollIntervalSeconds: 60
    # Optional: tune CPU and memory for the ingest job/cronjob
    resources:
      requests:
        cpu: "100m"
        memory: "256Mi"
      limits:
        cpu: "500m"
        memory: "1Gi"
    # Optional: you could also set suspend: true here to pause ingestion logic
    suspend: false

  transform:
    # A friendly name for this transform step
    name: user-events-transform
    # Bigquery project
    project: data-group
    # Enviroument target (e.g Dev or Pord)
    target: dev
    # The container image to run the transformation (typically a dbt runner)
    image: ghcr.io/org/dbt-core:1.7.9
    # Optional args passed to the transform Job (override `models` and container entrypoint)
    args:
      - "run"
      - "--select"
      - "stg_user_events"
      # List of models to stage
    models:
      - stg_user_events
    # Optional: tune CPU and memory for the transform job
    resources:
      requests:
        cpu: "250m"
        memory: "512Mi"
      limits:
        cpu: "1"
        memory: "2Gi"
    # Optional: The engine used for transformation
    engine: dbt
    # Optional:  Owner of this transform logic (team, project, etc.)
    owner: analytics-team
     # Optional: you could also set suspend: true here to pause transform logic
    suspend: false
